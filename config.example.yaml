# ============================================================================
# config.example.yaml — скопируй в config.yaml и заполни под свой сайт
# ============================================================================

site:
  base_url: "https://example.com"     # адрес твоего сайта
  dry_run: true                       # ВАЖНО: true = ничего не трогает, только тест.
                                      # Поставь false, когда пропишешь эндпоинты.

  # --- способ входа на сайт (выбери ОДНО) ---
  # Вариант А: у тебя есть API-токен (проще и надёжнее) — логин/пароль не нужны
  api_token: ""
  api_token_header: "Authorization"
  api_token_prefix: "Bearer "

  # Вариант Б: бот логинится на сайт как админ (заполни, если api_token пустой)
  login:
    path: "/api/login"
    username: ""                      # логин админа
    password: ""
    username_field: "login"
    password_field: "password"
    success_re: ""                    # необязательно: regex по ответу = «вошёл»

  # Создание ключа — бот заходит под твоим аккаунтом и создаёт ключ
  create_key:
    path: "/api/keys/create"
    method: "POST"
    as_json: false                    # true = слать JSON, false = form-data
    amount_field: "amount"            # имя поля с количеством токенов
    username_field: "username"        # к кому привязать; "" = поле не слать
    key_json_path: "key"              # где ключ в JSON-ответе: "key" или "data.key"
    key_regex: ""                     # fallback для текстового ответа
    generate_locally: false           # true = сайт принимает готовый ключ от бота
    key_template: "TOK-{amount}-{rand8}"
    extra_fields: {}                  # любые доп. поля (напр. token: "секрет")

# Сколько токенов даёт каждый лот. ID лота смотри в адресе лота на FunPay.
amounts:
  lots:
    # "123456789": 2000000            # лот «2кк токенов»
    # "987654321": 500000             # лот «500к токенов»
  parse_from_text: true               # понимать «2кк», «2000000», «2.5 млн» из текста

# Тексты, которые бот отправит покупателю
messages:
  success: "✅ Оплата получена! Вам начислено {amount_formatted} токенов.\n🔑 Ваш ключ: {key}"
  no_amount: "⚠️ Не смог определить количество токенов в заказе. Напишите администратору."
  error: "⚠️ Произошла ошибка при выдаче ключей, администратор уже в курсе."
